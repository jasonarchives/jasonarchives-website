<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas | Jason Mendes</title>

  <link rel="stylesheet" href="core.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>

  <style>
    body.page-atlas {
      margin: 0; padding: 0;
      overflow: hidden;
      background-color: var(--bg-color);
    }

    #atlas-container {
      width: 100vw; height: 100vh;
      position: absolute; top: 0; left: 0;
      cursor: grab;
      transform: translateZ(0);
      will-change: transform;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }
    #atlas-container:active { cursor: grabbing; }

    /* Transitions */
    .link-main {
      stroke: var(--text-color); stroke-opacity: 0.6; stroke-width: 1.5px;
      transition: stroke-opacity 0.4s ease, opacity 0.4s ease;
    }
    .link-sub {
      stroke: var(--text-color); stroke-opacity: 0.2; stroke-width: 1px; stroke-dasharray: 4,4;
      transition: stroke-opacity 0.4s ease, opacity 0.4s ease;
    }

    .node-group { transition: opacity 0.4s ease; }
    .node-super { fill: var(--bg-color); stroke: var(--text-color); stroke-width: 2px; }
    .node-record { fill: var(--text-color); }

    .label-super { font-family: 'iA Writer Duospace', monospace; font-size: 14px; fill: var(--text-color); font-weight: bold; pointer-events: none; }
    .label-record { font-family: 'SF Pro Display', sans-serif; font-size: 11px; fill: var(--text-color); opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
    .label-tag { font-family: 'iA Writer Duospace', monospace; font-size: 11px; fill: var(--text-color); opacity: 0.5; cursor: pointer; letter-spacing: 0.1em; }

    /* THE PURE PERFORMANCE DEPTH ENGINE */
    .is-hover-dimmed { opacity: 0.15 !important; pointer-events: none; }
    .is-active-dimmed { opacity: 0.06 !important; pointer-events: none; }
    .is-highlighted { opacity: 1 !important; fill: var(--accent-color) !important; stroke: var(--accent-color) !important; }

    /* HUD Elements */
    .hud-overlay {
      position: absolute; top: 2rem; left: 2rem;
      font-family: 'iA Writer Duospace', monospace; font-size: 0.75rem;
      color: var(--text-color); opacity: 0.5; pointer-events: none;
      z-index: 100;
    }

    /* Execution Trail CSS */
    #execution-trail {
      margin-top: 1rem;
      color: var(--accent-color);
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.2rem;
      font-weight: bold;
    }
    .trail-link { cursor: pointer; transition: color 0.2s ease; text-transform: lowercase; }
    .trail-link:hover { color: var(--text-color); text-decoration: underline; }
    .trail-separator { opacity: 0.4; font-weight: normal; }

    /* System Navigation */
    .system-nav {
      position: absolute; top: 2rem; right: 2rem;
      display: flex; gap: 1.5rem; z-index: 100;
    }
    .system-nav-btn {
      background: transparent; border: none; font-family: 'iA Writer Duospace', monospace;
      font-size: 0.85rem; color: var(--text-color); cursor: pointer;
      letter-spacing: 0.05em; padding: 0; transition: transform 0.2s ease, color 0.2s ease;
    }
    .system-nav-btn:hover { color: var(--accent-color); }
    .system-nav-btn.btn-back:hover { transform: translate3d(-4px, 0, 0); }
    .system-nav-btn.btn-home:hover { transform: translate3d(0, -2px, 0); }

    /* Zoom Controls */
    .zoom-controls {
      position: absolute; bottom: 2rem; right: 2rem;
      display: flex; flex-direction: column; gap: 0.5rem; z-index: 100;
    }
    .zoom-btn {
      background: transparent; border: 1px solid rgba(var(--rgb-text), 0.2);
      color: var(--text-color); width: 2.5rem; height: 2.5rem;
      display: flex; justify-content: center; align-items: center;
      font-family: 'iA Writer Duospace', monospace; font-size: 1.2rem;
      cursor: pointer; transition: border-color 0.2s ease, color 0.2s ease;
    }
    .zoom-btn:hover { border-color: var(--text-color); color: var(--accent-color); }
    .zoom-label { font-family: 'iA Writer Duospace', monospace; font-size: 0.6rem; color: var(--text-color); opacity: 0.5; text-align: center; margin-bottom: 0.2rem; }
    .label-desc { font-family: 'iA Writer Duospace', monospace; font-size: 8px; fill: var(--text-color); opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }

    /* The Sidebar */
    .tag-sidebar {
      position: absolute; top: 7.5rem; left: 2rem;
      display: flex; flex-direction: column; gap: 0.8rem; z-index: 100;
      max-height: calc(100vh - 10rem); overflow-y: auto; pointer-events: auto;
    }
    .tag-sidebar::-webkit-scrollbar { display: none; }
    .tag-sidebar { -ms-overflow-style: none; scrollbar-width: none; }
    .tag-sidebar-btn {
      background: transparent; border: none; font-family: 'iA Writer Duospace', monospace;
      font-size: 0.75rem; color: var(--text-color); opacity: 0.5; text-align: left;
      cursor: pointer; padding: 0; transition: opacity 0.2s ease, color 0.2s ease, transform 0.2s ease;
      letter-spacing: 0.05em; transform-origin: left;
    }
    .tag-sidebar-btn:hover { opacity: 1; color: var(--accent-color); transform: scale(1.05); }
    .tag-sidebar-btn.active-tag { opacity: 1; color: var(--accent-color); font-weight: bold; }

    /* THE RADAR CSS */
    .radar-container {
      position: absolute; bottom: 2rem; left: 2rem;
      width: 160px; height: 160px;
      border: 1px solid rgba(var(--rgb-text), 0.2);
      z-index: 100; pointer-events: none;
      background: var(--bg-color);
    }
    .radar-label {
      position: absolute; top: -1.2rem; left: 0;
      font-family: 'iA Writer Duospace', monospace; font-size: 0.6rem;
      color: var(--text-color); opacity: 0.5;
    }
    #radar-svg { width: 100%; height: 100%; }
    .radar-node { fill: var(--text-color); opacity: 0.3; }
    .radar-node.super { fill: var(--bg-color); stroke: var(--text-color); stroke-width: 4px; opacity: 0.8; }
    .radar-viewport { fill: transparent; stroke: var(--accent-color); stroke-width: 6px; }

/* 🟢 UPGRADE: THE FLOATING CARD CSS */
    .quick-peek-panel {
      position: absolute;
      top: 5rem;
      right: 2rem;
      width: 260px;
      max-height: calc(100vh - 7rem);

      /* 🟢 THE BLUR TWEAK: 85% solid background + 16px blur */
      background-color: color-mix(in srgb, var(--bg-color) 70%, transparent);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px); /* Safari support */

      border: 1px dotted var(--accent-color);
      border-radius: 12px;

      transform: translateX(calc(100% + 3rem));
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;

      z-index: 200;
      padding: 1.25rem;
      box-sizing: border-box;
      display: flex; flex-direction: column; gap: 1rem;
      color: var(--text-color);
      box-shadow: -5px 5px 20px rgba(0,0,0,0.1);
      overflow-y: auto;
    }

    /* Hide scrollbars for brutalist look */
    .quick-peek-panel::-webkit-scrollbar { display: none; }
    .quick-peek-panel { -ms-overflow-style: none; scrollbar-width: none; }

    .quick-peek-panel.is-open {
      transform: translateX(0);
      opacity: 1;
    }

    .close-peek {
      background: none; border: none; color: var(--text-color);
      cursor: pointer; text-align: left; font-family: 'iA Writer Duospace', monospace;
      font-size: 0.75rem; /* Reduced font */
      opacity: 0.5; padding: 0;
    }
    .close-peek:hover { opacity: 1; color: var(--accent-color); }

    .peek-type { font-family: 'iA Writer Duospace', monospace; font-size: 0.7rem; opacity: 0.5; letter-spacing: 0.05em; }

    /* Scaled down typography */
    .peek-title { font-family: 'SF Pro Display', sans-serif; font-size: 1.2rem; line-height: 1.1; margin: 0; }
    .peek-desc { font-family: 'SF Pro Display', sans-serif; font-size: 0.85rem; line-height: 1.4; opacity: 0.8; }

    .peek-meta-title { font-family: 'iA Writer Duospace', monospace; font-size: 0.6rem; opacity: 0.5; margin-bottom: -0.5rem; letter-spacing: 0.05em; }
    .peek-meta-content { display: flex; flex-wrap: wrap; gap: 0.5rem; flex-direction: column; }
    .peek-meta-content.row { flex-direction: row; }

    .peek-tag {
      font-family: 'iA Writer Duospace', monospace; font-size: 0.6rem;
      opacity: 0.6; border: 1px solid rgba(var(--rgb-text), 0.3);
      padding: 0.2rem 0.4rem; border-radius: 2px; text-transform: uppercase;
      pointer-events: none;
    }
    .peek-record-text {
      font-family: 'iA Writer Duospace', monospace; font-size: 0.75rem;
      color: var(--text-color); display: block; opacity: 0.7;
      pointer-events: none;
    }

    .peek-execute {
      margin-top: auto; background: var(--text-color); color: var(--bg-color);
      border: none; padding: 0.8rem; /* Tightened padding */
      cursor: pointer; font-family: 'iA Writer Duospace', monospace;
      font-size: 0.75rem; font-weight: bold; transition: opacity 0.2s; text-align: center;
      letter-spacing: 0.05em;
    }
    .peek-execute:hover { opacity: 0.8; }
    .peek-execute.hidden { display: none; }
  </style>
</head>
<body class="page-atlas">

  <div class="hud-overlay">
    [ SYSTEM ATLAS ]<br>
    INTERACTION: PAN / ZOOM / ISOLATE
    <div id="execution-trail">
      <span class="trail-link" data-id="root">PATH: ~/atlas</span>
    </div>
  </div>

  <div class="tag-sidebar" id="tag-sidebar"></div>

  <div class="radar-container">

    <svg id="radar-svg"></svg>
  </div>

  <div id="quick-peek" class="quick-peek-panel">
    <button class="close-peek" onclick="closePeek()">[ ✕ DISMISS ]</button>
    <div class="peek-type" id="peek-type">[ TYPE ]</div>
    <h2 class="peek-title" id="peek-title">Title</h2>
    <p class="peek-desc" id="peek-desc">Description</p>

    <div class="peek-meta-title" id="peek-meta-title">METADATA:</div>
    <div class="peek-meta-content" id="peek-meta-content"></div>

    <button class="peek-execute" id="peek-execute">[ EXECUTE ↗ ]</button>
  </div>

  <div class="system-nav">
    <button class="system-nav-btn btn-back" onclick="routeOut('back')">[ ← BACK ]</button>
    <button class="system-nav-btn btn-home" onclick="routeOut('home')">[ ⌂ HOME ]</button>
  </div>

  <div class="zoom-controls">
    <div class="zoom-label" id="zoom-percent">100%</div>
    <button class="zoom-btn" id="zoom-in">+</button>
    <button class="zoom-btn" id="zoom-reset">⌂</button>
    <button class="zoom-btn" id="zoom-out">-</button>
  </div>

  <svg id="atlas-container"></svg>




<script>
    window.closePeek = function() {
      document.getElementById('atlas-container').dispatchEvent(new Event('click'));
    };

    window.routeOut = function(destination) {
      document.body.style.transition = "opacity 0.4s ease";
      document.body.style.opacity = 0;

      setTimeout(() => {
        if (destination === 'back') {
          if (document.referrer.includes(window.location.hostname) && document.referrer !== "") {
            window.history.back();
          } else {
            window.location.href = '/index.html';
          }
        } else if (destination === 'home') {
          window.location.href = '/index.html';
        }
      }, 400);
    };

    document.addEventListener("DOMContentLoaded", () => {
      const width = window.innerWidth;
      const height = window.innerHeight;

      const svg = d3.select("#atlas-container")
        .attr("viewBox", [0, 0, width, height]);

      const radarSvg = d3.select("#radar-svg")
        .attr("viewBox", [0, 0, width, height]);
      const radarViewport = radarSvg.append("rect")
        .attr("class", "radar-viewport");

      const g = svg.append("g");
      let activeNode = null;
      let trailHistory = [];

      const zoom = d3.zoom()
        .scaleExtent([0.2, 3])
        .on("zoom", (event) => {
          g.attr("transform", event.transform);
          document.getElementById("zoom-percent").innerText = Math.round(event.transform.k * 100) + "%";

          radarViewport
            .attr("x", -event.transform.x / event.transform.k)
            .attr("y", -event.transform.y / event.transform.k)
            .attr("width", width / event.transform.k)
            .attr("height", height / event.transform.k);
        });

      svg.call(zoom);

      d3.select("#zoom-in").on("click", () => svg.transition().duration(400).call(zoom.scaleBy, 1.4));
      d3.select("#zoom-out").on("click", () => svg.transition().duration(400).call(zoom.scaleBy, 0.7));

      d3.json("archive-map.json").then(data => {

        // 🟢 DYNAMIC ORBITAL CALCULATION (Future-Proofing)
        // This mathematically distributes any number of supernodes evenly around the center
        const supernodes = data.nodes.filter(n => n.group === 'supernode');
        const numSupernodes = supernodes.length;
        // Orbit radius adapts to screen size (35% of the shortest dimension)
        const orbitRadius = Math.min(width, height) * 0.35;

        supernodes.forEach((sn, i) => {
          // Divide a full circle (2 * PI) by the total number of archives
          const angle = (i / numSupernodes) * 2 * Math.PI;
          sn.targetX = (width / 2) + orbitRadius * Math.cos(angle);
          sn.targetY = (height / 2) + orbitRadius * Math.sin(angle);
        });

        const simulation = d3.forceSimulation(data.nodes)
          .force("link", d3.forceLink(data.links).id(d => d.id).distance(d => d.type === "main" ? 120 : 180))
          .force("charge", d3.forceManyBody().strength(-300))
          .force("center", d3.forceCenter(width / 2, height / 2))
          .force("collide", d3.forceCollide().radius(d => d.group === "supernode" ? 50 : 20).iterations(1))
          // 🟢 Pull each supernode to its dynamically calculated orbital position
          .force("x", d3.forceX(d => d.group === "supernode" ? d.targetX : width / 2).strength(d => d.group === "supernode" ? 0.12 : 0))
          .force("y", d3.forceY(d => d.group === "supernode" ? d.targetY : height / 2).strength(d => d.group === "supernode" ? 0.12 : 0));

        const link = g.append("g")
          .selectAll("line")
          .data(data.links)
          .join("line")
          .attr("class", d => d.type === "main" ? "link-main" : "link-sub");

        const node = g.append("g")
          .selectAll("g")
          .data(data.nodes)
          .join("g")
          .attr("class", "node-group")
          .style("cursor", "pointer")
          .call(drag(simulation));

        node.each(function(d) {
          const el = d3.select(this);
          if (d.group === "supernode") {
            el.append("circle").attr("r", 35).attr("class", "node-super");
            el.append("text").text(d.id).attr("dy", -2).attr("text-anchor", "middle").attr("class", "label-super");
            if (d.desc) { el.append("text").text(d.desc).attr("dy", 16).attr("text-anchor", "middle").attr("class", "label-desc"); }
          } else if (d.group === "record") {
            el.append("circle").attr("r", 6).attr("class", "node-record");
            el.append("text").text(d.label).attr("dx", 12).attr("dy", 4).attr("class", "label-record");
            if (d.desc) { el.append("text").text(d.desc).attr("dx", 12).attr("dy", 18).attr("class", "label-desc"); }
          } else if (d.group === "tag") {
            el.append("text").text(`[ ${d.id.toUpperCase()} ]`).attr("dy", 4).attr("text-anchor", "middle").attr("class", "label-tag");
          }
        });

        const radarNodes = radarSvg.append("g")
          .selectAll("circle")
          .data(data.nodes)
          .join("circle")
          .attr("class", d => d.group === "supernode" ? "radar-node super" : "radar-node")
          .attr("r", d => d.group === "supernode" ? 150 : (d.group === "record" ? 45 : 20));

        function getNeighbors(nodeData) {
          return data.links.filter(l => l.source.id === nodeData.id || l.target.id === nodeData.id)
                           .map(l => l.source.id === nodeData.id ? l.target.id : l.source.id);
        }

        const tagSidebar = document.getElementById("tag-sidebar");
        const allTags = data.nodes.filter(n => n.group === "tag").sort((a, b) => a.id.localeCompare(b.id));

        allTags.forEach(tagNode => {
          const btn = document.createElement("button");
          btn.className = "tag-sidebar-btn";
          btn.innerText = `[ ${tagNode.id.toUpperCase()} ]`;
          btn.dataset.id = tagNode.id;

          btn.addEventListener("click", (event) => {
            event.stopPropagation();
            triggerNode(tagNode);
          });
          tagSidebar.appendChild(btn);
        });

        function renderTrail() {
          const trailContainer = document.getElementById("execution-trail");
          trailContainer.innerHTML = `<span class="trail-link" data-id="root">PATH: ~/atlas</span>`;

          trailHistory.forEach(step => {
            trailContainer.innerHTML += `<span class="trail-separator">/</span>`;
            const formattedName = step.id.replace(/\s+/g, '-').toLowerCase();
            trailContainer.innerHTML += `<span class="trail-link" data-id="${step.id}">${formattedName}</span>`;
          });

          document.querySelectorAll('.trail-link').forEach(link => {
            link.addEventListener('click', (event) => {
              event.stopPropagation();
              const clickedId = link.dataset.id;

              if (clickedId === 'root') {
                resetGraph();
              } else {
                if (clickedId === activeNode) return;

                const targetNode = data.nodes.find(n => n.id === clickedId);
                const stepIndex = trailHistory.findIndex(t => t.id === clickedId);
                if (stepIndex !== -1) {
                  trailHistory = trailHistory.slice(0, stepIndex);
                }
                triggerNode(targetNode);
              }
            });
          });
        }

        renderTrail();

        function resetGraph() {
          // ALWAYS reset the camera, regardless of whether a node is open
          svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity);

          if (!activeNode) return;

          const prevNode = data.nodes.find(n => n.id === activeNode);
          if (prevNode) { prevNode.fx = null; prevNode.fy = null; }
          activeNode = null;

          trailHistory = [];
          renderTrail();

          document.getElementById('quick-peek').classList.remove('is-open');

          node.classed("is-hover-dimmed", false).classed("is-active-dimmed", false);
          link.classed("is-hover-dimmed", false).classed("is-active-dimmed", false);

          node.selectAll("circle").classed("is-highlighted", false);
          node.selectAll(".label-record").style("opacity", 0);
          node.selectAll(".label-desc").style("opacity", 0);
          node.selectAll(".label-tag").style("opacity", 0.5);

          document.querySelectorAll(".tag-sidebar-btn").forEach(btn => btn.classList.remove("active-tag"));

          simulation.force("link").distance(d => d.type === "main" ? 120 : 180);
          simulation.force("charge").strength(-300);
          // Return to organic collisions
          simulation.force("collide", d3.forceCollide().radius(d => d.group === "supernode" ? 50 : 20).iterations(1));

          // Snap nodes back to their dynamic orbital quadrants
          simulation.force("x", d3.forceX(d => d.group === "supernode" ? d.targetX : width / 2).strength(d => d.group === "supernode" ? 0.12 : 0));
          simulation.force("y", d3.forceY(d => d.group === "supernode" ? d.targetY : height / 2).strength(d => d.group === "supernode" ? 0.12 : 0));

          simulation.alpha(0.8).restart();
        }

        svg.on("click", resetGraph);
        d3.select("#zoom-reset").on("click", resetGraph);

        node.on("mouseover", function(event, d) {
          if (activeNode) return;
          const neighbors = getNeighbors(d);

          node.classed("is-hover-dimmed", n => n.id !== d.id && !neighbors.includes(n.id));
          link.classed("is-hover-dimmed", l => l.source.id !== d.id && l.target.id !== d.id);

          d3.select(this).select("circle").classed("is-highlighted", true);
          node.selectAll(".label-record").style("opacity", n => (n.id === d.id || neighbors.includes(n.id)) ? 1 : 0);
        })
        .on("mouseout", function() {
          if (activeNode) return;

          node.classed("is-hover-dimmed", false);
          link.classed("is-hover-dimmed", false);

          node.selectAll("circle").classed("is-highlighted", false);
          node.selectAll(".label-record").style("opacity", 0);
        });

        node.on("click", function(event, d) {
          event.stopPropagation();
          triggerNode(d);
        });

        function triggerNode(d) {
          if (activeNode === d.id) {
            resetGraph();
            return;
          }

          if (activeNode) {
            const prevNode = data.nodes.find(n => n.id === activeNode);
            if (prevNode) { prevNode.fx = null; prevNode.fy = null; }
          }

          activeNode = d.id;
          const neighbors = getNeighbors(d);

          d.fx = d.x;
          d.fy = d.y;

          const peekType = document.getElementById('peek-type');
          const peekTitle = document.getElementById('peek-title');
          const peekDesc = document.getElementById('peek-desc');
          const peekMetaTitle = document.getElementById('peek-meta-title');
          const peekMetaContent = document.getElementById('peek-meta-content');
          const executeBtn = document.getElementById('peek-execute');

          peekMetaContent.innerHTML = '';

          if (d.group === 'supernode') {
            peekType.innerText = '[ ARCHIVE ]';
            peekTitle.innerText = d.id;
            peekDesc.innerText = d.desc || "Root archive folder.";
            peekMetaTitle.innerText = 'INDEXED RECORDS:';
            peekMetaContent.classList.remove('row');

            const childRecords = data.nodes.filter(n => n.group === 'record' && neighbors.includes(n.id));
            childRecords.forEach(r => {
              peekMetaContent.innerHTML += `<span class="peek-record-text">↳ ${r.label || r.id}</span>`;
            });
            executeBtn.innerText = '[ OPEN ARCHIVE ↗ ]';
            executeBtn.classList.remove('hidden');

          } else if (d.group === 'record') {
            peekType.innerText = '[ RECORD ]';
            peekTitle.innerText = d.label || d.id;
            peekDesc.innerText = d.desc || "Archival record data.";
            peekMetaTitle.innerText = 'TAGS:';
            peekMetaContent.classList.add('row');

            const attachedTags = data.nodes.filter(n => n.group === 'tag' && neighbors.includes(n.id));
            attachedTags.forEach(t => {
              peekMetaContent.innerHTML += `<span class="peek-tag">${t.id}</span>`;
            });
            executeBtn.innerText = '[ EXECUTE RECORD ↗ ]';
            executeBtn.classList.remove('hidden');

          } else if (d.group === 'tag') {
            peekType.innerText = '[ TAG ]';
            peekTitle.innerText = d.id.toUpperCase();
            peekDesc.innerText = "Tags connect related records together based on a theme or location.";
            peekMetaTitle.innerText = 'CONNECTED RECORDS:';
            peekMetaContent.classList.remove('row');

            const taggedRecords = data.nodes.filter(n => n.group === 'record' && neighbors.includes(n.id));
            taggedRecords.forEach(r => {
              peekMetaContent.innerHTML += `<span class="peek-record-text">↳ ${r.label || r.id}</span>`;
            });
            executeBtn.classList.add('hidden');
          }

          if (d.url) {
            executeBtn.onclick = () => {
              if (d.external) window.open(d.url, '_blank');
              else {
                document.body.style.transition = "opacity 0.4s ease";
                document.body.style.opacity = 0;
                setTimeout(() => window.location.href = d.url, 400);
              }
            };
          }

          document.getElementById('quick-peek').classList.add('is-open');

          const existingIndex = trailHistory.findIndex(step => step.id === d.id);
          if (existingIndex !== -1) {
            trailHistory = trailHistory.slice(0, existingIndex + 1);
          } else {
            const isSibling = trailHistory.length > 0 &&
                              trailHistory[trailHistory.length - 1].group === 'record' &&
                              d.group === 'record';
            if (isSibling) {
              trailHistory[trailHistory.length - 1] = d;
            } else {
              trailHistory.push(d);
            }
          }
          renderTrail();

          svg.transition().duration(750).call(
            zoom.transform,
            d3.zoomIdentity.translate((width / 2) - 130, height / 2).scale(1).translate(-d.x, -d.y)
          );

          node.classed("is-hover-dimmed", false);
          link.classed("is-hover-dimmed", false);

          node.classed("is-active-dimmed", n => n.id !== d.id && !neighbors.includes(n.id));
          link.classed("is-active-dimmed", l => l.source.id !== d.id && l.target.id !== d.id);

          node.selectAll("circle").classed("is-highlighted", n => n.id === d.id);
          node.selectAll(".label-record").style("opacity", n => (n.id === d.id || neighbors.includes(n.id)) ? 1 : 0);
          node.selectAll(".label-desc").style("opacity", n => n.id === d.id ? 0.6 : 0);
          node.selectAll(".label-tag").style("opacity", n => n.id === d.id ? 1 : 0.5);

          document.querySelectorAll(".tag-sidebar-btn").forEach(btn => {
            if (btn.dataset.id === d.id) {
              btn.classList.add("active-tag");
            } else {
              btn.classList.remove("active-tag");
            }
          });

          simulation.force("x").strength(0);
          simulation.force("y").strength(0);

          simulation.force("link").distance(l => (l.source.id === d.id || l.target.id === d.id) ? 140 : 250);
          simulation.force("charge").strength(n => (n.id === d.id || neighbors.includes(n.id)) ? -150 : -1000);

          // THE CLEARING EFFECT: Push overlapping nodes away from active text
          simulation.force("collide", d3.forceCollide().radius(n => {
            if (n.id === d.id || neighbors.includes(n.id)) {
               if (n.group === "record" || n.group === "tag") {
                 const textString = n.label || n.id || "";
                 return 20 + (textString.length * 3.5);
               }
               return 65;
            }
            return n.group === "supernode" ? 50 : 20;
          }).iterations(3));

          simulation.alpha(0.8).restart();
        }

        simulation.on("tick", () => {
          link
            .attr("x1", d => d.source.x)
            .attr("y1", d => d.source.y)
            .attr("x2", d => d.target.x)
            .attr("y2", d => d.target.y);

          node.attr("transform", d => `translate(${d.x},${d.y})`);

          radarNodes
            .attr("cx", d => d.x)
            .attr("cy", d => d.y);
        });

        function drag(simulation) {
          function dragstarted(event) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            event.subject.fx = event.subject.x;
            event.subject.fy = event.subject.y;
          }
          function dragged(event) {
            event.subject.fx = event.x;
            event.subject.fy = event.y;
          }
          function dragended(event) {
            if (!event.active) simulation.alphaTarget(0);
            if (event.subject.id !== activeNode) {
              event.subject.fx = null;
              event.subject.fy = null;
            }
          }
          return d3.drag().on("start", dragstarted).on("drag", dragged).on("end", dragended);
        }
      }).catch(error => {
          console.error("Failed to load or parse JSON:", error);
      });
    });
  </script>
